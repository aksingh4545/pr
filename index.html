<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Simple Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5f5f5;
      color: #333;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    main {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      margin-top: 30px;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Website</h1>
    <p>A simple HTML starter page.</p>
  </header>

  <main>
    <section>
      <h2>About</h2>
      <p>This is a basic HTML page with a title, a heading, and some simple styling.</p>
    </section>

    <section>
      <h2>Features</h2>
      <ul>
        <li>Responsive layout</li>
        <li>Clean and simple design</li>
        <li>Easy to customize</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>© 2026 My Simple Website</p>
  </footer>
</body>
</html>
